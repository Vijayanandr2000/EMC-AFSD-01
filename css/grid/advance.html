<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid</title>
  <style>
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      grid-template-areas:
        "entrance entrance br-1"
        "br-2 hall hall"
        "br-2 staircase parking"
      ;
    }

    .items{
      background-color: red;
      padding: 10px;
    }
/*
    .item1 {
      grid-column: 1 / 3;

      grid-row: 1 / 3;
    }

    .item2 {
      grid-row: 1 / 3;
    } */

    .entrance{
      grid-area: entrance;
    }

    .br1{
      grid-area: br-1;
    }

    .br2{
      grid-area: br-2;
    }
    .kitchen{
      grid-area: kitchen;
    }
    .hall{
      grid-area: hall;
    }
    .staircase{
      grid-area: staircase;
    }
    .parking{
      grid-area: parking;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- <div class="items item1">Items 1</div>
    <div class="items item2">Items 2</div>
    <div class="items">Items 3</div>
    <div class="items">Items 4</div>
    <div class="items">Items 5</div>
    <div class="items">Items 6</div> -->
    <div class="items entrance">Entrance</div>
    <div class="items br1">BR-1</div>
    <div class="items br2">BR-2</div>
    <!-- <div class="items kitchen">Kitchen</div> -->
    <div class="items hall">Hall</div>
    <div class="items staircase">Staircase</div>
    <div class="items parking">Parking</div>
  </div>

</body>
</html>
