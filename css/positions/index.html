  <title>Document</title>

  <style>
    *{
      box-sizing: border-box;
      max-width: 100%;
      margin:0;
      padding: 0;
    }

    body{
            height: 1000px;

    }


    .static{
      background: red;
      position: static;
      top:10px;
      border: 1px solid black;

      z-index: 2;
    }

    .relative{
      background: red;
      border: 1px solid black;

      position: relative;
      top:10px;
      /* z-index: -1; */
    }

    .absolute{
      background: red;
      border: 1px solid black;

      /* position: absolute; */
      /* top:10px; */
      /* z-index: -1 */
    }

    .fixed{
      background: red;
      border: 1px solid black;

      position: fixed;
      top:0
    }

    .sticky{
      background: blue;
      border: 1px solid black;

      position: sticky;
      top:0;
      margin-top: 100px;
    }



    .parent{
      background: blue;
      border: 1px solid black;
      margin-top: 200px;
      padding: 50px;

      position: relative;
    }

    .child{
      background: red;
      border: 1px solid black;
      padding: 50px;

      position: absolute;
      top: 10px
    }

    .parent1{
      color: red
    }

    .parent2{
      color: blue
    }

    .child1{
      color: purple
    }

    .border{
      border: 1px solid red;
      position: relative;
      top: 100px;
      text-align: center;
      display: inline-block;
      padding: 10px 40px 20px 30px;
    }

    span:first-child{
      visibility: hidden;
    }


  </style>
</head>
