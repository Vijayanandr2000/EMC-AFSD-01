<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transition</title>
  <style>
    .box {
      width: 100px;
      height: 100px;
      /* background-color: red; */
      transition: 1s;
      animation: rotation 5s 1;
      border-radius: 50%;
      border: 10px solid rgba(53, 61, 213, 0.868);
      border-top-color: grey;
      /* animation: ; */
    }

    .box:hover {
      background-color: black;
    }

    @keyframes rotation {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    h1 {
      width: 0;
      overflow: hidden;
      animation: typing 2s steps(15) infinite;
      border-right: 2px solid black;
    }


    @keyframes typing {
      from {
        width: 0;
      }

      to {
        width: 250px;
      }

    }

    .box1{
      position: relative;
      top: 200px;
      animation: down-up 2s infinite;
    }

    @keyframes down-up {
      0% {
        top: 200px;
        opacity: 0.2;
      }

      75% {
        opacity: 1;
      }

      100% {
        top: 0;
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- <div class="box"></div> -->

  <h1>VIJAYANAND</h1>
  <!-- <h2>Tharun</h2> -->

  <div class="box1">
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Vitae eos harum nulla eveniet rem officiis, aliquid vero, enim qui soluta, exercitationem veniam! Beatae libero sint magnam maiores, mollitia odit in.</p>
  </div>

</body>
</html>
